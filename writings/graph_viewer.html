ic hub was paralyzed. Medical evacuation flights were grounded, forcing critical patients to be ...", "chapter_anchor": 12, "properties": {"tier": "bronze_plus", "source_file": "ch12_sec12.5_bronze_plus.md", "section_number": "12.5"}, "cargo_title": null, "cargo_url": null, "cargo_bucket": null, "cargo_date": null, "cargo_abstract": null, "manuscript_text": null, "manuscript_envelope": {}}}, {"id": "anchor_el_paso_matters_2026_12_5", "label": "Manuscript Anchor: El Paso Matters (2026) (Sec 12.5)", "title": "<b>Manuscript Anchor: El Paso Matters (2026) (Sec 12.5)</b><br>Type: VIGNETTE<br>ID: anchor_el_paso_matters_2026_12_5", "group": "VIGNETTE", "shape": "dot", "color": {"background": "#374151", "border": "#9ca3af", "highlight": "#d1d5db"}, "font": {"color": "#ffffff", "size": 13, "face": "system-ui, sans-serif"}, "raw_data": {"node_id": "anchor_el_paso_matters_2026_12_5", "node_type": "VIGNETTE", "label": "Manuscript Anchor: El Paso Matters (2026) (Sec 12.5)", "description": "El Paso Matters (2026), \"Southern New Mexico airspace reopens after FAA ban\", El Paso Matters, URL: https://elpasomatters.org/2026/02/11/southern-new-mexico-airspace-reopens-after-faa-ban/", "chapter_anchor": 12, "properties": {"origin": "manuscript_bronze_plus", "citation_string": "El Paso Matters (2026), \"Southern New Mexico airspace reopens after FAA ban\", El Paso Matters, URL: https://elpasomatters.org/2026/02/11/southern-new-mexico-airspace-reopens-after-faa-ban/"}, "cargo_title": null, "cargo_url": null, "cargo_bucket": null, "cargo_date": null, "cargo_abstract": null, "manuscript_text": null, "manuscript_envelope": {}}}, {"id": "chunk:ch08_sec8.3_p001", "label": "ch08_sec8.3_p001 (Austerity Deception)", "title": "<b>ch08_sec8.3_p001 (Austerity Deception)</b><br>Type: MANUSCRIPT_CHUNK<br>ID: chunk:ch08_sec8.3_p001", "group": "MANUSCRIPT_CHUNK", "shape": "box", "color": {"background": "#581c87", "border": "#a855f7", "highlight": "#c084fc"}, "font": {"color": "#ffffff", "size": 13, "face": "system-ui, sans-serif"}, "raw_data": {"node_id": "chunk:ch08_sec8.3_p001", "node_type": "MANUSCRIPT_CHUNK", "label": "ch08_sec8.3_p001 (Austerity Deception)", "description": "Fiscal necessity as secondary deception; infinite capital for replacement vs. ground truth as technical debt.", "chapter_anchor": 8, "properties": {"chunk_id": "ch08_sec8.3_p001", "source_table": "ship.letters_of_marque", "chapter_number": 8, "section_number": "8.3", "paragraph_sequence_number": 1}, "cargo_title": null, "cargo_url": null, "cargo_bucket": null, "cargo_date": null, "cargo_abstract": null, "manuscript_text": "### 8.3 The Financial and Physical Solvent\nThe liquidation of the record is frequently masked by a narrative of fiscal necessity, but a forensic examination of the numbers reveals this to be a secondary deception. In the \"Hard 2025\" economy, the financial justifications for destroying archives are so mathematically insignificant that they cease to be economic arguments and become pure evidence of institutional disregard. We are witnessing a civilizational mismatch where the capital required to maintain the \"Ground Truth\" is treated as an intolerable \"Technical Debt,\" while the capital required to automate its replacement is infinite.", "manuscript_envelope": {"poles": [{"name": "Archival Liquidation via Spurious Fiscal Justification", "core_concept": "Executive decision-makers decommission historical record stores and truncate retention schedules under the pretext of budget austerity, even when physical and cloud storage line items represent negligible operational costs.", "metaphor_translations": [{"author_metaphor": "liquidation of the record / destroying archives", "audit_translations": ["data purge", "record disposition", "database decommissioning", "retention schedule reduction", "unauthorized record destruction"]}, {"author_metaphor": "narrative of fiscal necessity", "audit_translations": ["cost-avoidance justification", "storage cost optimization", "budgetary austerity defense", "cloud storage overhead rationalization"]}]}, {"name": "Capital Displacement from Empirical Verification to Automated Substitution", "core_concept": "Organizations administratively reclassify empirical baseline records as dispensable maintenance liabilities while directing unconstrained capital expenditure into generative modeling and synthetic replacement pipelines.", "metaphor_translations": [{"author_metaphor": "Ground Truth as Technical Debt", "audit_translations": ["legacy database maintenance liability", "historical data obsolescence classification", "warehouse upkeep overhead", "unfunded data retention liability"]}, {"author_metaphor": "capital required to automate its replacement is infinite", "audit_translations": ["generative AI capex", "synthetic training data procurement", "automated system implementation budget", "LLM pipeline modernization expenditure"]}]}], "search_query": "(\"data purge\" OR \"record disposition\" OR \"database decommissioning\" OR \"retention schedule reduction\" OR \"archival destruction\") AND (\"cost avoidance\" OR \"storage cost optimization\" OR \"budgetary austerity\" OR \"technical debt\") AND (\"generative AI capex\" OR \"synthetic data procurement\" OR \"IT modernization budget\" OR \"automated replacement\")", "embedding_probes": ["cost-benefit analysis legacy archive decommissioning versus generative AI procurement expenditure", "public record retention schedule reduction under storage cost justification audit", "defunding historical database maintenance while expanding synthetic training data capital expenditure", "forensic audit of archival preservation budget cuts versus enterprise automation investments"], "paragraph_summary": "Institutional administrators use negligible cost-saving claims to decommission and purge verified historical archives while concurrently reallocating substantial capital budgets toward synthetic automation systems."}}}, {"id": "chunk:ch08_sec8.3_p002", "label": "ch08_sec8.3_p002 (Stargate vs. NASA Goddard)", "title": "<b>ch08_sec8.3_p002 (Stargate vs. NASA Goddard)</b><br>Type: MANUSCRIPT_CHUNK<br>ID: chunk:ch08_sec8.3_p002", "group": "MANUSCRIPT_CHUNK", "shape": "box", "color": {"background": "#581c87", "border": "#a855f7", "highlight": "#c084fc"}, "font": {"color": "#ffffff", "size": 13, "face": "system-ui, sans-serif"}, "raw_data": {"node_id": "chunk:ch08_sec8.3_p002", "node_type": "MANUSCRIPT_CHUNK", "label": "ch08_sec8.3_p002 (Stargate vs. NASA Goddard)", "description": "Contrast between Microsoft/OpenAI $100B Stargate and $10M NASA Goddard library closure.", "chapter_anchor": 8, "properties": {"chunk_id": "ch08_sec8.3_p002", "source_table": "ship.letters_of_marque", "chapter_number": 8, "section_number": "8.3", "paragraph_sequence_number": 2}, "cargo_title": null, "cargo_url": null, "cargo_bucket": null, "cargo_date": null, "cargo_abstract": null, "manuscript_text": "The most damning evidence of this absurdity is found in the contrast between the \"Stargate\" project and the closure of the NASA Goddard Library. In early 2024, Reuters documented a joint venture between Microsoft and OpenAI to construct a $100 billion supercomputer, codenamed \"Stargate,\" designed specifically to meet the computational demands of the next generation of Large Language Models [Reuters Investigative Team (2024), \"Microsoft and OpenAI Planning $100 Billion Stargate Supercomputer Project\", Reuters Technology News, URL: https://www.reuters.com/technology/microsoft-openai-planning-100-billion-data-center-project-the-information-reports-2024-03-29/]. This $100 billion investment\u2014a figure exceeding the annual GDP of many sovereign nations\u2014is dedicated entirely to the \"Statistical Turn,\" the process of refining the \"Logical Pre-processors\" that generate plausible simulations of knowledge. Yet, as the \"Stargate\" rose, the primary sources it was intended to simulate were being sent to the incinerator. In January 2026, the investigative team at *People Matters* broke the story of the permanent closure of the NASA Goddard Library. This facility, which served as the navigational archive for the American space program, was liquidated to achieve a reported \"Workforce Optimization\" saving of approximately $10 million. The forensic report detailed the disposal of thousands of physical volumes, including one-of-a-kind Soviet-era mission logs and early Hubble technical manuals that had never been digitized. The *People Matters* report noted the hollow irony of the event: \"NASA is disposing of the original receipts of the Apollo and Hubble eras to save a sum of money that represents approximately 0.01% of the 'Stargate' budget. This is not a budget cut; it is a statement that the mission logs are no longer viewed as 'Data' by the current management class. They are viewed as 'clutter' that lacks forward compatibility with the machine\" [People Matters Investigative Team (2026), \"NASA Closes Historical Goddard Library in Workforce Optimization Drive\", People Matters Global, URL: https://www.peoplemattersglobal.com/news/workforce-management/nasa-goddard-library-closure-workforce-optimization-2026].", "manuscript_envelope": {"poles": [{"name": "Hyper-Scale Synthetic AI Capitalization", "core_concept": "Corporate actors direct massive private capital expenditures toward speculative computing infrastructure designed to train and run predictive large language models.", "metaphor_translations": [{"author_metaphor": "Stargate", "audit_translations": ["hyperscale data center", "joint venture infrastructure investment", "supercomputer cluster procurement"]}, {"author_metaphor": "Statistical Turn", "audit_translations": ["large language model training", "generative AI deployment", "probabilistic machine learning workloads"]}, {"author_metaphor": "Logical Pre-processors", "audit_translations": ["foundation models", "inference pipelines", "synthetic text generators"]}]}, {"name": "Institutional De-accessioning and Archival Liquidation", "core_concept": "Public agency administrators eliminate physical, undigitized historical records to realize marginal operational budget reductions under administrative efficiency mandates.", "metaphor_translations": [{"author_metaphor": "sent to the incinerator", "audit_translations": ["de-accessioning", "document destruction", "unauthorized record disposal", "waste stream transfer"]}, {"author_metaphor": "Workforce Optimization", "audit_translations": ["operating budget reduction", "facility downsizing", "administrative cost cutting", "headcount reduction"]}, {"author_metaphor": "clutter that lacks forward compatibility", "audit_translations": ["legacy paper holdings", "undigitized historical assets", "non-standardized physical media", "unindexed archival inventory"]}]}], "search_query": "(\"Stargate\" OR \"supercomputer\" OR \"OpenAI\" OR \"Microsoft\" OR \"capital expenditure\" OR \"data center investment\") AND (\"NASA Goddard Library\" OR \"library closure\" OR \"archive liquidation\" OR \"decommissioning\" OR \"document destruction\" OR \"retention schedule\") AND (\"workforce optimization\" OR \"budget cuts\" OR \"undigitized records\" OR \"cost reduction\")", "embedding_probes": ["OpenAI Microsoft Stargate supercomputer capital expenditure data center", "NASA Goddard Library closure archival liquidation physical records disposal", "budgetary austerity public science archives versus generative AI infrastructure investment", "undigitized historical mission logs decommissioning workforce optimization"], "paragraph_summary": "The excerpt contrasts private tech sector capital allocation toward a hundred-billion-dollar AI supercomputer with public sector budgetary liquidation of irreplaceable physical scientific archives at NASA Goddard."}}}, {"id": "chunk:ch08_sec8.3_p003", "label": "ch08_sec8.3_p003 (Regulatory Over-compliance)", "title": "<b>ch08_sec8.3_p003 (Regulatory Over-compliance)</b><br>Type: MANUSCRIPT_CHUNK<br>ID: chunk:ch08_sec8.3_p003", "group": "MANUSCRIPT_CHUNK", "shape": "box", "color": {"background": "#581c87", "border": "#a855f7", "highlight": "#c084fc"}, "font": {"color": "#ffffff", "size": 13, "face": "system-ui, sans-serif"}, "raw_data": {"node_id": "chunk:ch08_sec8.3_p003", "node_type": "MANUSCRIPT_CHUNK", "label": "ch08_sec8.3_p003 (Regulatory Over-compliance)", "description": "Institutions using privacy/data minimization laws as legal shields to purge environmental impact tables.", "chapter_anchor": 8, "properties": {"chunk_id": "ch08_sec8.3_p003", "source_table": "ship.letters_of_marque", "chapter_number": 8, "section_number": "8.3", "paragraph_sequence_number": 3}, "cargo_title": null, "cargo_url": null, "cargo_bucket": null, "cargo_date": null, "cargo_abstract": null, "manuscript_text": "This disregard for the record has been formalized through a process I call \"Regulatory Over-compliance.\" Institutions are increasingly utilizing privacy and data-protection laws as a legal shield for the wholesale liquidation of their history. We only know the scale of this \"Regulatory Solvent\" because of the work of T. Lindsey and the Environmental Data & Governance Initiative (EDGI). In their 2025 audit, *The State of Federal Open Data*, they documented how government agencies began removing decades of environmental impact reports and hydrology tables by citing \"data minimization\" requirements\u2014a distorted interpretation of the \"Right to be Forgotten.\" As Lindsey observed: \"The institutions are not deleting data to protect the privacy of citizens; they are deleting it to reduce their own 'risk surface.' If the data doesn't exist, it cannot be used in a lawsuit, it cannot be used to contradict a current policy, and it doesn't need to be maintained. They are using the language of 'Safety' and 'Compliance' to perform an act of archival arson\" [Environmental Data & Governance Initiative (EDGI) (2025), \"The State of Federal Open Data: Regulatory Minimization and the Siphoning of Public Science\", EDGI Annual Report, URL: https://envirodatagov.org/reports/state-of-federal-open-data-2025/].", "manuscript_envelope": {"poles": [{"name": "Pretextual Regulatory Compliance", "core_concept": "Administrative bodies re-interpret privacy and data minimization statutory mandates beyond their legislative scope to manufacture legal justification for withholding or erasing public assets.", "metaphor_translations": [{"author_metaphor": "Regulatory Over-compliance / Regulatory Solvent", "audit_translations": ["data minimization over-implementation", "regulatory pretext", "statutory misapplication", "defensive compliance posture", "retention policy manipulation"]}, {"author_metaphor": "Language of 'Safety' and 'Compliance'", "audit_translations": ["compliance mandate citation", "privacy shield invocation", "administrative exemption claim", "statutory justification defense"]}]}, {"name": "Systematic Public Record Liquidation", "core_concept": "Custodians deliberately dismantle public scientific registries and unpublish historical baseline records to eliminate evidentiary trails and administrative memory.", "metaphor_translations": [{"author_metaphor": "Archival Arson / Wholesale Liquidation", "audit_translations": ["database decommissioning", "data purge", "scrubbing public archives", "unauthorized records destruction", "bulk record disposition", "open data siphoning"]}]}, {"name": "Institutional Liability and Oversight Evasion", "core_concept": "General counsel and leadership proactively eliminate evidentiary records to preemptively sanitize the organization's discovery surface against legal challenges and public accountability.", "metaphor_translations": [{"author_metaphor": "Reduce their own 'risk surface'", "audit_translations": ["litigation risk mitigation", "e-discovery exposure reduction", "FOIA evasion", "spoliation risk defense", "administrative liability avoidance"]}]}], "search_query": "(\"data minimization\" OR \"privacy laws\" OR \"Right to be Forgotten\" OR \"retention schedule\") AND (\"environmental impact\" OR \"hydrology tables\" OR \"scientific datasets\" OR \"federal open data\") AND (\"purged\" OR \"deletion\" OR \"decommissioning\" OR \"scrubbing\" OR \"record destruction\") AND (\"litigation risk\" OR \"legal liability\" OR \"risk surface\" OR \"EDGI\" OR \"FOIA\")", "embedding_probes": ["agency data minimization environmental impact report deletion", "weaponized privacy compliance federal records destruction audit", "EDGI report open science hydrology database decommissioning", "retention schedule alteration to reduce institutional legal exposure", "pretextual data protection compliance public records suppression"], "paragraph_summary": "Federal agencies systematically delete public environmental and scientific datasets under the pretext of privacy and data minimization compliance to reduce institutional legal liability and avoid oversight."}}}, {"id": "chunk:ch08_sec8.3_p004", "label": "ch08_sec8.3_p004 (Commercial Enclosure of SSRN)", "title": "<b>ch08_sec8.3_p004 (Commercial Enclosure of SSRN)</b><br>Type: MANUSCRIPT_CHUNK<br>ID: chunk:ch08_sec8.3_p004", "group": "MANUSCRIPT_CHUNK", "shape": "box", "color": {"background": "#581c87", "border": "#a855f7", "highlight": "#c084fc"}, "font": {"color": "#ffffff", "size": 13, "face": "system-ui, sans-serif"}, "raw_data": {"node_id": "chunk:ch08_sec8.3_p004", "node_type": "MANUSCRIPT_CHUNK", "label": "ch08_sec8.3_p004 (Commercial Enclosure of SSRN)", "description": "Elsevier acquisition of Bepress/SSRN bricking supplemental data and runtime verification environments.", "chapter_anchor": 8, "properties": {"chunk_id": "ch08_sec8.3_p004", "source_table": "ship.letters_of_marque", "chapter_number": 8, "section_number": "8.3", "paragraph_sequence_number": 4}, "cargo_title": null, "cargo_url": null, "cargo_bucket": null, "cargo_date": null, "cargo_abstract": null, "manuscript_text": "This is the global application of the \"Dependency Model\" we discussed in Section I. By treating the record as a \"Mineral\" state that is expensive to maintain and legally \"risky\" to possess, the state ensures that the only remaining \"Truth\" is the \"Plausible Slop\" served up by the current algorithmic cycle. This institutional disregard has breached the final vault of the academy: the repositories of the Learned Societies. We only know the scale of this \"Forward Compatibility Crisis\" because of the forensic auditing of digital infrastructures like Bepress and SSRN. When the conglomerate Elsevier acquired these community-based platforms in 2017, the \"Passive Persistence\" of the academic record was traded for the \"Dependency Model\" of private equity. By 2025, researchers in the Modern Language Association (MLA) and the IEEE began documenting a catastrophic \"Bricking\" of the supplemental data required to verify peer-reviewed findings. Thousands of data sets, interactive maps, and primary source archives\u2014once attached to papers as the \"receipts\" of truth\u2014are now inaccessible because the proprietary software environments required to \"perform\" them have been optimized out of existence by the new owners. As the 2025 SPARC audit of these \"Captive Repositories\" concluded: \"We are witnessing the industrialization of amnesia. Even the most prestigious journals in the world are failing to maintain the forward compatibility of their own archives, leaving the scientific record as a collection of dead links and 'Ghost Facts' that can no longer be checked against reality\" [SPARC (2025), \"Captive Repositories: How Commercial Enclosure Bricked Scholarly Supplemental Archives\", SPARC Open Science Report, URL: https://sparcopen.org/reports/captive-repositories-2025/].", "manuscript_envelope": {"poles": [{"name": "Commercial Platform Enclosure & Asset Stripping", "core_concept": "Corporate publishers acquire independent scholarly infrastructure and eliminate cost-heavy maintenance of legacy runtimes and data hosting to maximize profit margins and shed legal custody risks.", "metaphor_translations": [{"author_metaphor": "Captive Repositories", "audit_translations": ["proprietary repository lock-in", "acquired scholarly infrastructure", "commercial open-access platforms", "monopolistic academic publishing"]}, {"author_metaphor": "Dependency Model of private equity", "audit_translations": ["infrastructure underfunding", "margin optimization", "vendor lock-in", "cost-cutting software deprecation"]}, {"author_metaphor": "Mineral state expensive to maintain", "audit_translations": ["data liability minimization", "storage cost rationalization", "selective data retention", "decommissioned legacy databases"]}]}, {"name": "Runtime Bitrot & Execution Incompatibility", "core_concept": "Digital artifacts and analytical code rot into illegibility because publishers host static files without preserving the execution dependencies, virtualization layers, or software ecosystems required to run them.", "metaphor_translations": [{"author_metaphor": "Forward Compatibility Crisis", "audit_translations": ["long-term digital preservation failure", "software environment obsolescence", "dependency decay", "lack of software containerization"]}, {"author_metaphor": "Bricking of supplemental data", "audit_translations": ["unexecutable code dependencies", "proprietary file format decay", "broken interactive media", "abandoned API endpoints"]}, {"author_metaphor": "Industrialization of amnesia", "audit_translations": ["systemic archive rot", "wholesale digital obsolescence", "retention schedule failures", "unmaintained research repositories"]}]}, {"name": "Epistemic Provenance Degradation", "core_concept": "Peer-reviewed literature is structurally decoupled from its underlying evidentiary base, converting empirical claims into uncheckable assertions through broken links and orphaned data.", "metaphor_translations": [{"author_metaphor": "Ghost Facts", "audit_translations": ["unreproducible findings", "unverifiable citations", "orphaned scientific claims", "unsubstantiated conclusions"]}, {"author_metaphor": "Receipts of truth", "audit_translations": ["raw supplemental datasets", "underlying primary records", "audit trails", "reproducibility artifacts"]}, {"author_metaphor": "Plausible Slop", "audit_translations": ["unverified scholarly output", "synthetic publication churn", "uncorrected literature", "paper mill artifacts"]}]}], "search_query": "(\"Elsevier\" OR \"Bepress\" OR \"SSRN\" OR \"commercial publisher\" OR \"repository acquisition\" OR \"private equity enclosure\") AND (\"supplemental data\" OR \"supplementary material\" OR \"digital preservation\" OR \"software obsolescence\" OR \"forward compatibility\" OR \"bitrot\" OR \"broken links\" OR \"runtime dependency\") AND (\"reproducibility\" OR \"replication audit\" OR \"SPARC\" OR \"provenance\" OR \"data availability statement\" OR \"unverifiable\")", "embedding_probes": ["Elsevier Bepress SSRN supplemental data accessibility preservation failure", "commercial acquisition academic repository supplemental software environment obsolescence", "scholarly communication digital archives forward compatibility broken replication data", "SPARC audit captive repositories interactive data bricking verification"], "paragraph_summary": "Corporate acquisition and cost-cutting across academic preprint and repository infrastructures (e.g., Elsevier acquiring Bepress and SSRN) have rendered essential supplemental research data and runtime environments obsolete, preventing the replication and verification of peer-reviewed scientific claims."}}}, {"id": "chunk:ch08_sec8.3_p005", "label": "ch08_sec8.3_p005 (Sanitized School Libraries)", "title": "<b>ch08_sec8.3_p005 (Sanitized School Libraries)</b><br>Type: MANUSCRIPT_CHUNK<br>ID: chunk:ch08_sec8.3_p005", "group": "MANUSCRIPT_CHUNK", "shape": "box", "color": {"background": "#581c87", "border": "#a855f7", "highlight": "#c084fc"}, "font": {"color": "#ffffff", "size": 13, "face": "system-ui, sans-serif"}, "raw_data": {"node_id": "chunk:ch08_sec8.3_p005", "node_type": "MANUSCRIPT_CHUNK", "label": "ch08_sec8.3_p005 (Sanitized School Libraries)", "description": "Purging physical history books from school libraries to force students into liquid, remote-editable digital platforms.", "chapter_anchor": 8, "properties": {"chunk_id": "ch08_sec8.3_p005", "source_table": "ship.letters_of_marque", "chapter_number": 8, "section_number": "8.3", "paragraph_sequence_number": 5}, "cargo_title": null, "cargo_url": null, "cargo_bucket": null, "cargo_date": null, "cargo_abstract": null, "manuscript_text": "The physical liquidation reaches its terminal phase in the \"Sanitized Library\" of the public school system. We know the exact volume of this erasure because PEN America tracks the \"Chain of Ruin\" at the community level. Their 2025 *Index of School Book Bans* documented over 10,000 unique titles targeted for removal in the 2024-2025 cycle, a 200% increase over the previous year [PEN America (2025), \"Banned in the USA: The Ongoing Escalation of Book Removals in Public Schools\", PEN America Freedom to Write Index, URL: https://pen.org/report/banned-in-the-usa-2025/]. When we look at the specific titles being removed\u2014histories of the civil rights movement, primary source accounts of the Holocaust, and foundational humanities texts\u2014we see the same \"Optimization\" logic at work. The removals are often justified by the \"Logical Pre-processors\" of local school boards as \"curriculum efficiency.\" By stripping the physical library of its \"Passive Persistence,\" the institution ensures that the student is forced back into the \"Dependency Model\" of the network. In the digital network, history is \"Liquid\"\u2014it can be re-written, pruned for SEO, or vaporized by a remote server handshake. The book on the shelf was a \"Stone\" that could be used to verify a fact; the digital portal is a \"Vapor\" that can be edited in real-time. We have built a system where the \"Stargate\" can simulate any history it wants, because the institutions have ensured that the actual receipts of our history no longer exist in a verifiable, physical form.", "manuscript_envelope": {"poles": [{"name": "Administrative Textual Liquidation and Material Censorship", "core_concept": "School district officials and regulatory boards systematically remove tangible books through formal challenges, policy audits, and deaccessioning procedures.", "metaphor_translations": [{"author_metaphor": "Physical liquidation / Sanitized Library", "audit_translations": ["book deaccessioning", "physical collection weeding", "material challenge removals", "library book bans"]}, {"author_metaphor": "Chain of Ruin / Index of School Book Bans", "audit_translations": ["title challenge log", "curriculum challenge database", "PEN America banned books census", "district reconsideration list"]}, {"author_metaphor": "Optimization / Logical Pre-processors / Curriculum efficiency", "audit_translations": ["administrative review policy", "parental challenge compliance", "statutory content audit", "curriculum realignment guidelines"]}, {"author_metaphor": "Stone / Passive Persistence", "audit_translations": ["immutable physical print copies", "permanent library holdings", "unaltered primary source literature", "tangible records"]}]}, {"name": "Vendor-Mediated Epistemic Ephemerality and Dynamic Control", "core_concept": "Institutions shift information retrieval from persistent material artifacts to centralized, proprietary digital licensing architectures capable of silent and unilateral modification.", "metaphor_translations": [{"author_metaphor": "Dependency Model / Stargate", "audit_translations": ["vendor-managed digital repository", "centralized learning management system (LMS)", "proprietary e-reader platform", "licensed e-book distribution network"]}, {"author_metaphor": "Liquid / Vapor / Remote server handshake", "audit_translations": ["dynamic remote content modification", "silent database revision", "DRM-enforced license revocation", "digital catalog content updates"]}]}], "search_query": "(\"book ban\" OR \"book removal\" OR \"deaccessioning\" OR \"library weeding\" OR \"curriculum challenge\" OR \"PEN America\") AND (\"school board\" OR \"K-12\" OR \"public school library\" OR \"district policy\") AND (\"digital licensing\" OR \"e-book platform\" OR \"content curation\" OR \"remote deletion\" OR \"digital textbook revision\")", "embedding_probes": ["PEN America public school book removals and library deaccession policies", "school board curriculum efficiency challenges Holocaust civil rights histories", "transition from physical print library collections to ephemeral digital licensing", "remote vendor content modification and silent updates in K-12 educational platforms"], "paragraph_summary": "School boards are systematically purging physical history and humanities texts from public school libraries under bureaucratic pretexts, compelling students onto centrally managed digital platforms where curriculum can be altered or erased remotely."}}}, {"id": "CONCEPT:civilizational_capital_asymmetry", "label": "Civilizational Capital Asymmetry", "title": "<b>Civilizational Capital Asymmetry</b><br>Type: CONCEPT<br>ID: CONCEPT:civilizational_capital_asymmetry", "group": "CONCEPT", "shape": "diamond", "color": {"background": "#1e3a8a", "border": "#3b82f6", "highlight": "#60a5fa"}, "font": {"color": "#ffffff", "size": 13, "face": "system-ui, sans-serif"}, "raw_data": {"node_id": "CONCEPT:civilizational_capital_asymmetry", "node_type": "CONCEPT", "label": "Civilizational Capital Asymmetry", "description": "The structural economic inversion where capital markets allocate infinite funding to automated prediction while starving primary empirical preservation of nominal maintenance.", "chapter_anchor": 8, "properties": {"actor_class": "Technology conglomerate executives, venture capital syndicates, and enterprise procurement officers", "epistemic_harm": "The empirical foundation of human knowledge is hollowed out, leaving generative AI models to recursively train on simulations of data whose physical receipts have been incinerated.", "exculpatory_alibi": "Technological inevitability, market demand, and fiscal austerity", "epistemic_invariant": "Societies that prioritize statistical plausibility over empirical verification starve ground-truth custodial labor while lavishing infinite speculative capital on generative simulation machines.", "behavioral_qualifier": "by actively channeling hundreds of billions into speculative generative compute while treating ten-million-dollar archival baselines as an intolerable cost center"}, "cargo_title": null, "cargo_url": null, "cargo_bucket": null, "cargo_date": null, "cargo_abstract": null, "manuscript_text": null, "manuscript_envelope": {}}}, {"id": "CONCEPT:weaponized_regulatory_compliance", "label": "Weaponized Regulatory Compliance", "title": "<b>Weaponized Regulatory Compliance</b><br>Type: CONCEPT<br>ID: CONCEPT:weaponized_regulatory_compliance", "group": "CONCEPT", "shape": "diamond", "color": {"background": "#1e3a8a", "border": "#3b82f6", "highlight": "#60a5fa"}, "font": {"color": "#ffffff", "size": 13, "face": "system-ui, sans-serif"}, "raw_data": {"node_id": "CONCEPT:weaponized_regulatory_compliance", "node_type": "CONCEPT", "label": "Weaponized Regulatory Compliance", "description": "The intentional exploitation of privacy and data-protection mandates as legal pretexts to purge discoverable historical records and public science.", "chapter_anchor": 8, "properties": {"actor_class": "Government agency general counsels, regulatory compliance officers, and department heads", "epistemic_harm": "Evaporation of longitudinal civic evidence, rendering environmental degradation and corporate regulatory capture legally and historically invisible.", "exculpatory_alibi": "Statutory privacy compliance, citizen data protection, and administrative risk management", "epistemic_invariant": "When institutions face accountability for policy failures, they weaponize statutory compliance frameworks to erase the baseline empirical records that could document their malfeasance.", "behavioral_qualifier": "by actively invoking 'data minimization' and 'privacy protection' to permanently delete longitudinal public environmental baselines and hydrology tables"}, "cargo_title": null, "cargo_url": null, "cargo_bucket": null, "cargo_date": null, "cargo_abstract": null, "manuscript_text": null, "manuscript_envelope": {}}}, {"id": "cargo:1194", "label": "NASA's Largest Library Is Closing (NYT 2025-12-31)", "title": "<b>NASA's Largest Library Is Closing (NYT 2025-12-31)</b><br>Type: CARGO<br>ID: cargo:1194", "group": "CARGO", "shape": "ellipse", "color": {"background": "#064e3b", "border": "#10b981", "highlight": "#34d399"}, "font": {"color": "#ffffff", "size": 13, "face": "system-ui, sans-serif"}, "raw_data": {"node_id": "cargo:1194", "node_type": "CARGO", "label": "NASA's Largest Library Is Closing (NYT 2025-12-31)", "description": "Goddard Space Flight Center library closed; unique Soviet space race documents and Hubble records discarded amid workforce cuts.", "chapter_anchor": 8, "properties": {"outlet": "The New York Times", "source_url": "https://www.nytimes.com/2025/12/31/climate/nasa-goddard-library-closing.html?hl=en-US"}, "cargo_title": "NASA\u2019s Largest Library Is Closing Amid Staff and Lab Cuts", "cargo_url": "https://www.nytimes.com/2025/12/31/climate/nasa-goddard-library-closing.html?hl=en-US", "cargo_bucket": "acquisitions/nasas-largest-library-is-closing-amid-staff-and-lab-cuts.txt", "cargo_date": "2025-12-31", "cargo_abstract": "Holdings from the library at the Goddard Space Flight Center, which includes unique documents from the early 20th century to the Soviet space race, will be warehoused or thrown out.", "manuscript_text": null, "manuscript_envelope": {}}}, {"id": "CONCEPT:ontological_demotion_of_undigitized_truth", "label": "Ontological Demotion of Undigitized Truth", "title": "<b>Ontological Demotion of Undigitized Truth</b><br>Type: CONCEPT<br>ID: CONCEPT:ontological_demotion_of_undigitized_truth", "group": "CONCEPT", "shape": "diamond", "color": {"background": "#1e3a8a", "border": "#3b82f6", "highlight": "#60a5fa"}, "font": {"color": "#ffffff", "size": 13, "face": "system-ui, sans-serif"}, "raw_data": {"node_id": "CONCEPT:ontological_demotion_of_undigitized_truth", "node_type": "CONCEPT", "label": "Ontological Demotion of Undigitized Truth", "description": "The managerial reclassification of physical, un-digitized primary observational evidence from foundational knowledge into disposable operational clutter.", "chapter_anchor": 8, "properties": {"actor_class": "Institutional research directors, facilities administrators, and agency operations executives", "epistemic_harm": "Permanent, unrecoverable erasure of ground-truth observational receipts and unique historical artifacts (e.g., Soviet flight logs, Hubble calibration manuals) that can never be reconstructed.", "exculpatory_alibi": "Workforce optimization, facilities consolidation, and operational efficiency", "epistemic_invariant": "If a primary observational record cannot be ingested as structured tokens by the dominant computational paradigm, administrative classes redefine it as non-data overhead, accelerating its physical destruction.", "behavioral_qualifier": "by deliberately choosing to rebrand un-tokenized physical observation logs as spatial clutter rather than allocating archival custodial resources"}, "cargo_title": null, "cargo_url": null, "cargo_bucket": null, "cargo_date": null, "cargo_abstract": null, "manuscript_text": null, "manuscript_envelope": {}}}, {"id": "CONCEPT:commercial_enclosure_of_verification_infrastructure", "label": "Commercial Enclosure of Verification Infrastructure", "title": "<b>Commercial Enclosure of Verification Infrastructure</b><br>Type: CONCEPT<br>ID: CONCEPT:commercial_enclosure_of_verification_           } else if (params.edges.length > 0) {
            const edgeId = params.edges[0];
            const edge = filteredEdges.find(e => e.id === edgeId);
            inspectEdge(edge);
          }
        });

      } catch (err) {
        console.error("Failed to load graph:", err);
      }
    }

    function inspectNode(node) {
      if (!node) return;
      const d = node.raw_data;
      const headerTitle = document.getElementById('inspector-title');
      const headerBadge = document.getElementById('inspector-badge');
      const content = document.getElementById('inspector-content');

      headerTitle.innerText = d.label || d.node_id;
      
      let badgeHtml = '';
      if (d.node_type === 'CONCEPT') badgeHtml = '<span class="badge badge-concept">CONCEPT INVARIANT</span>';
      else if (d.node_type === 'MANUSCRIPT_CHUNK') badgeHtml = '<span class="badge badge-chunk">LETTER OF MARQUE (CHUNK)</span>';
      else if (d.node_type === 'CARGO') badgeHtml = '<span class="badge badge-cargo">EXTERNAL CARGO RECEIPT</span>';
      else badgeHtml = `<span class="badge">${d.node_type}</span>`;
      headerBadge.innerHTML = badgeHtml;

      let html = '';

      // Node ID Card
      html += `
        <div class="card">
          <div class="card-title">Node ID & Anchor</div>
          <div class="card-body"><code>${d.node_id}</code> (Chapter ${d.chapter_anchor || 'N/A'})</div>
        </div>
      `;

      if (d.description) {
        html += `
          <div class="card">
            <div class="card-title">Thesis Definition</div>
            <div class="card-body">${d.description}</div>
          </div>
        `;
      }

      // If CONCEPT, render Hook 5-Part Causal Anatomy
      if (d.node_type === 'CONCEPT' && d.properties) {
        const p = d.properties;
        html += `
          <div class="card" style="border-color: #3b82f6;">
            <div class="card-title" style="color: #60a5fa;">Hook 5-Part Causal Anatomy</div>
            
            <div class="hook-prop">
              <div class="hook-label">1. Epistemic Invariant</div>
              <div class="hook-val">${p.epistemic_invariant || 'N/A'}</div>
            </div>

            <div class="hook-prop">
              <div class="hook-label">2. Non-Reified Actor Class</div>
              <div class="hook-val" style="color: #fca5a5;">${p.actor_class || 'N/A'}</div>
            </div>

            <div class="hook-prop">
              <div class="hook-label">3. Active Behavioral Qualifier</div>
              <div class="hook-val">${p.behavioral_qualifier || 'N/A'}</div>
            </div>

            <div class="hook-prop">
              <div class="hook-label">4. Exculpatory Alibi (Pretext)</div>
              <div class="hook-val" style="color: #fde047;">${p.exculpatory_alibi || 'N/A'}</div>
            </div>

            <div class="hook-prop">
              <div class="hook-label">5. Epistemic Harm</div>
              <div class="hook-val" style="color: #fdba74;">${p.epistemic_harm || 'N/A'}</div>
            </div>
          </div>
        `;
      }

      // If MANUSCRIPT CHUNK, render Chunk Text and Envelope
      if (d.node_type === 'MANUSCRIPT_CHUNK') {
        if (d.manuscript_text) {
          html += `
            <div class="card">
              <div class="card-title">Verbatim Manuscript Chunk</div>
              <div class="quote-box">${d.manuscript_text}</div>
            </div>
          `;
        }
        if (d.manuscript_envelope && d.manuscript_envelope.search_query) {
          html += `
            <div class="card" style="border-color: #a855f7;">
              <div class="card-title" style="color: #c084fc;">Discovery Search Net (Boolean)</div>
              <div class="card-body"><code style="font-size: 11px; word-break: break-all;">${d.manuscript_envelope.search_query}</code></div>
            </div>
          `;
        }
      }

      // If CARGO, render Metadata details
      if (d.node_type === 'CARGO') {
        html += `
          <div class="card" style="border-color: #10b981;">
            <div class="card-title" style="color: #34d399;">Cargo Provenance & Receipt</div>
            <div class="card-body">
              <div style="font-weight: 600; margin-bottom: 6px;">${d.cargo_title || 'N/A'}</div>
              <div style="font-size: 12px; color: #94a3b8; margin-bottom: 4px;">Date: ${d.cargo_date || 'N/A'}</div>
              <div style="font-size: 12px; margin-bottom: 8px;"><a href="${d.cargo_url}" target="_blank" style="color: #38bdf8; text-decoration: underline;">View Original Source ↗</a></div>
              <div class="quote-box" style="border-color: #10b981;">${d.cargo_abstract || 'No abstract'}</div>
              <div style="font-size: 11px; color: #64748b; margin-top: 6px;">Bucket: <code>${d.cargo_bucket || 'N/A'}</code></div>
            </div>
          </div>
        `;
      }

      content.innerHTML = html;
    }

    function inspectEdge(edge) {
      if (!edge) return;
      const d = edge.raw_data;
      const headerTitle = document.getElementById('inspector-title');
      const headerBadge = document.getElementById('inspector-badge');
      const content = document.getElementById('inspector-content');

      headerTitle.innerText = `${d.predicate}`;
      headerBadge.innerHTML = `<span class="badge" style="background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #0284c7;">ONTOLOGY EDGE (Weight: ${d.weight})</span>`;

      let html = `
        <div class="card">
          <div class="card-title">Edge Topology</div>
          <div class="card-body">
            <div style="margin-bottom: 4px;"><b>From:</b> <code>${d.source}</code></div>
            <div style="margin-bottom: 4px;"><b>Predicate:</b> <code>${d.predicate}</code></div>
            <div><b>To:</b> <code>${d.target}</code></div>
          </div>
        </div>

        <div class="card" style="border-color: #0284c7;">
          <div class="card-title" style="color: #38bdf8;">Forensic Causal Context</div>
          <div class="card-body" style="font-size: 13.5px; line-height: 1.5;">${d.context || 'No context recorded.'}</div>
        </div>
      `;

      if (d.properties && Object.keys(d.properties).length > 0) {
        html += `
          <div class="card">
            <div class="card-title">Edge Properties (JSONB)</div>
            <div class="card-body"><pre style="font-size: 11px; color: #cbd5e1; white-space: pre-wrap;">${JSON.stringify(d.properties, null, 2)}</pre></div>
          </div>
        `;
      }

      content.innerHTML = html;
    }

    function resetPhysics() {
      if (network) {
        network.fit();
      }
    }

    // Auto-load on page ready
    window.addEventListener('load', () => loadGraph('section8.3'));
  </script>
</body>
</html>
